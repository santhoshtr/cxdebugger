<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CX Page load debugger</title>
  <meta name="description" content="Translation debugger for Content Translation" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
  <link rel="stylesheet" href="lib/codex/theme-wikimedia-ui.css">
  <link rel="stylesheet" href="lib/codex/theme-wikimedia-ui-mode-dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
  <script>
    async function main() {
      const req = await fetch(
        `${host.value}/v2/page/${language.value}/fr/${title.value}`
      );
      return await req.json();
    }

    document.addEventListener("DOMContentLoaded", () => {
      articleform.addEventListener("submit", async (e) => {
        e.preventDefault();
        const result = await main();
        const doc = new DOMParser().parseFromString(result.segmentedContent, "text/html");
        // <base> has no effect in a shadow tree. Resolve the page's stylesheet URLs against it.
        for (const link of doc.querySelectorAll('link[rel~="stylesheet"]')) {
          link.setAttribute("href", link.href);
        }
        doc.querySelector("base")?.remove();
        // Render in a shadow root so the page's styles do not leak into this tool's UI.
        const root = article.shadowRoot || article.attachShadow({ mode: "open" });
        root.innerHTML = doc.head.innerHTML + doc.body.innerHTML +
          '<link rel="stylesheet" href="pageload.css">';
        const tones = ["progressive", "success", "warning", "error", "notice"];
        const sentencesEls = root.querySelectorAll(".cx-segment");
        for (let i = 0; i < sentencesEls.length; i++) {
          sentencesEls[i].dataset.tone = tones[i % tones.length];
        }
        return false;
      });
    });
  </script>
</head>

<body>
  <nav aria-label="Debuggers">
    <strong>CX Debugger</strong>
    <ul>
      <li><a href="translation.html">Translation debugger</a></li>
      <li><a href="templates.html">Template debugger</a></li>
      <li><a href="pageload.html" aria-current="page">Page loader debugger</a></li>
    </ul>
    <a href="https://github.com/santhoshtr/cxdebugger">Source code</a>
  </nav>

  <main>
    <h1>Page loader debugger</h1>

    <form id="articleform">
      <label class="wide">CXServer Host <input type="url" id="host" value="https://cxserver.wikimedia.org" /></label>
      <label>Article Language <input type="text" id="language" value="en" /></label>
      <label>Article Title <input type="text" id="title" value="Albert Einstein" /></label>
      <button type="submit">Submit</button>
    </form>
    <article id="article"></article>
  </main>
</body>

</html>
