<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Template adaptation debugger</title>
    <meta name="description" content="Template adaptation debugger for Content Translation" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
    <link rel="stylesheet" href="lib/codex/theme-wikimedia-ui.css">
    <link rel="stylesheet" href="lib/codex/theme-wikimedia-ui-mode-dark.css" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="style.css">
    <style>
        #status {
            min-height: var(--line-height-medium);
            color: var(--color-subtle);

            &[data-error] {
                color: var(--color-error);
            }
        }

        #summary {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-50) var(--spacing-150);
            padding: var(--spacing-75);
            background-color: var(--background-color-neutral-subtle);
            border: var(--border-subtle);
            border-radius: var(--border-radius-base);

            div {
                display: flex;
                flex-direction: column-reverse;
            }

            dt {
                font-size: var(--font-size-small);
                color: var(--color-subtle);
            }

            dd {
                margin: 0;
                font-size: var(--font-size-x-large);
                font-variant-numeric: tabular-nums;
            }
        }

        #filters {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-50) var(--spacing-100);
            align-items: center;
            border: 0;
            padding: 0;
            margin-block: var(--spacing-100);

            input:is([type="radio"], [type="checkbox"]) {
                accent-color: var(--accent-color-base);
            }
        }

        #results {
            details {
                border-block-end: var(--border-subtle);

                summary {
                    display: flex;
                    flex-wrap: wrap;
                    gap: var(--spacing-25) var(--spacing-100);
                    padding: var(--spacing-50);
                    cursor: var(--cursor-base--hover);
                    font-variant-numeric: tabular-nums;

                    &:hover {
                        background-color: var(--background-color-interactive-subtle--hover);
                    }

                    strong {
                        flex: 1 1 20rem;
                    }

                    span {
                        color: var(--color-subtle);
                    }
                }

                &[data-status="adapted"] summary strong::before { content: "✓ "; color: var(--color-success); }
                &[data-status="partial"] summary strong::before { content: "◐ "; color: var(--color-warning); }
                &[data-status="not-adapted"] summary strong::before { content: "✗ "; color: var(--color-error); }
                &[data-status="no-target"] summary strong::before { content: "∅ "; color: var(--color-error); }

                > div {
                    padding: 0 var(--spacing-50) var(--spacing-100) var(--spacing-150);
                }

                p {
                    margin-block: var(--spacing-50);
                }
            }

            [role="region"] {
                overflow: auto;
                max-height: 70vh;
            }

            table {
                border-collapse: separate;
                border-spacing: 0;
                width: 100%;
                font-size: var(--font-size-small);

                thead {
                    position: sticky;
                    top: 0;
                    background-color: var(--background-color-base);
                }

                th,
                td {
                    text-align: start;
                    padding: var(--spacing-25) var(--spacing-50);
                    border-block-end: var(--border-subtle);
                    vertical-align: top;
                }

                td:nth-child(3) {
                    max-width: 24rem;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                    color: var(--color-subtle);
                }

                tr[data-match="unmapped"] td:nth-child(4) { color: var(--color-error); }
                tr[data-match="ambiguous"] td:nth-child(4) { color: var(--color-warning); }
                tr[data-match="renamed"] td:nth-child(4) { color: var(--color-success); }
            }
        }

        body:has(#unmapped-only:checked) #results tbody tr:not([data-match="unmapped"]) {
            display: none;
        }
    </style>
    <script type="module" src="templates.js"></script>
</head>

<body>
    <nav aria-label="Debuggers">
        <strong>CX Debugger</strong>
        <ul>
            <li><a href="translation.html">Translation debugger</a></li>
            <li><a href="templates.html" aria-current="page">Template debugger</a></li>
            <li><a href="pageload.html">Page loader debugger</a></li>
        </ul>
        <a href="https://github.com/santhoshtr/cxdebugger">Source code</a>
    </nav>

    <main>
        <h1>Template adaptation debugger</h1>

        <form id="template-form">
            <label>cxserver API <input name="api" type="url" required size="32" value="https://cxserver.wikimedia.org"></label>
            <label>From <input name="from" required size="6" value="en"></label>
            <label>To <input name="to" required size="6" value="es"></label>
            <label>Title <input name="title" required size="28" value="Ada Lovelace"></label>
            <button type="submit">Adapt templates</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
        <dl id="summary" hidden></dl>
        <fieldset id="filters" hidden>
            <legend hidden>Filters</legend>
            <label><input type="radio" name="status" value="" checked> All</label>
            <label><input type="radio" name="status" value="no-target"> No target</label>
            <label><input type="radio" name="status" value="not-adapted"> Not adapted</label>
            <label><input type="radio" name="status" value="partial"> Partial</label>
            <label><input type="radio" name="status" value="adapted"> Adapted</label>
            <label>Template <input type="search" name="search"></label>
            <label><input type="checkbox" id="unmapped-only"> Only unmapped params</label>
        </fieldset>
        <div id="results"></div>
    </main>
</body>

</html>
