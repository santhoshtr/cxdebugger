<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Translation debugger</title>
	<meta name="description" content="Translation debugger for Content Translation" />
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>">
	<link rel="stylesheet" href="lib/codex/theme-wikimedia-ui.css">
	<link rel="stylesheet" href="lib/codex/theme-wikimedia-ui-mode-dark.css" media="(prefers-color-scheme: dark)">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="debugger.js"></script>
</head>

<body>
	<nav aria-label="Debuggers">
		<strong>CX Debugger</strong>
		<ul>
			<li><a href="translation.html" aria-current="page">Translation debugger</a></li>
			<li><a href="templates.html">Template debugger</a></li>
			<li><a href="pageload.html">Page loader debugger</a></li>
		</ul>
		<a href="https://github.com/santhoshtr/cxdebugger">Source code</a>
	</nav>

	<main>
		<h1>Translation debugger</h1>

		<form id="find-form">
			<label class="wide">Wiki API <input id="wiki-api" type="url" required size="32" value="https://en.wikipedia.org"></label>
			<label>Source language <input id="translation-from" type="text"></label>
			<label>Target language <input id="translation-to" type="text"></label>
			<label>Source title <input id="translation-source" type="text"></label>
			<button type="submit">Find</button>
		</form>

		<form id="fetch-form">
			<label>Translation Id <input id="translation-id" type="text"></label>
			<button type="submit">Fetch translation</button>
		</form>

		<progress id="progress" aria-label="Loading" hidden></progress>

		<div role="tablist" aria-label="Translation details">
			<button type="button" role="tab" id="tab-info" aria-controls="info" aria-selected="true">Information</button>
			<button type="button" role="tab" id="tab-translation" aria-controls="translation" aria-selected="false" tabindex="-1">Translation</button>
			<button type="button" role="tab" id="tab-preview" aria-controls="preview" aria-selected="false" tabindex="-1">Article preview</button>
			<button type="button" role="tab" id="tab-wikitext" aria-controls="wikitext" aria-selected="false" tabindex="-1">Wikitext</button>
		</div>
		<div id="info" role="tabpanel" aria-labelledby="tab-info" tabindex="0"></div>
		<div id="translation" role="tabpanel" aria-labelledby="tab-translation" tabindex="0" hidden>
			<table id="cxtable"></table>
		</div>
		<div id="preview" role="tabpanel" aria-labelledby="tab-preview" tabindex="0" hidden></div>
		<pre id="wikitext" role="tabpanel" aria-labelledby="tab-wikitext" tabindex="0" hidden></pre>
	</main>
</body>

</html>
